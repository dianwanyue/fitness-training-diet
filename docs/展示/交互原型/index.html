<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="data:," />
<title>循练 · 可交互原型</title>
<style>
  :root{
    --green:#14563f; --green-2:#2f7d5c; --green-3:#e7efe6;
    --cream:#f6f4ec; --card:#ffffff; --ink:#1f2a23; --muted:#6b7a6e;
    --line:#e2e6dc; --amber:#b9832f; --red:#b4553f; --blue:#3c6f8f;
    --shadow:0 18px 50px rgba(31,42,35,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% 0%, #f1eee2 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 100%, #e6ecdf 0%, transparent 55%),
      #e9e6d9;
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .stage{min-height:100vh;display:flex;gap:54px;justify-content:center;align-items:flex-start;padding:38px 28px 60px}
  .guide{width:330px;padding-top:12px;position:sticky;top:38px}
  .guide .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.12em;color:var(--green)}
  .guide .logo b{width:34px;height:34px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:17px;letter-spacing:0}
  .guide h1{font-size:38px;line-height:1.18;margin:26px 0 12px;letter-spacing:-.02em}
  .guide h1 span{color:var(--green-2)}
  .guide .lede{color:#4e5b51;line-height:1.8;font-size:14px;margin:0 0 22px}
  .guide .path{list-style:none;margin:0;padding:0;counter-reset:step}
  .guide .path li{counter-increment:step;display:flex;gap:12px;padding:9px 0;border-top:1px dashed #cfd6c8;font-size:13.5px;color:#3f4c43}
  .guide .path li:last-child{border-bottom:1px dashed #cfd6c8}
  .guide .path li::before{content:counter(step);flex:0 0 22px;height:22px;border-radius:50%;background:#fff;border:1px solid #cbd5c7;color:var(--green);font-size:11px;display:grid;place-items:center;font-weight:700}
  .guide .actions{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 10px}
  .guide .hint{font-size:12px;color:#77837a;line-height:1.7}
  .guide .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);background:#e7efe6;border:1px solid #d4e1d2;padding:5px 9px;border-radius:999px;letter-spacing:.04em}

  .phone{
    width:402px;height:838px;background:var(--cream);border-radius:40px;position:relative;
    border:9px solid #1d241f;box-shadow:0 30px 80px rgba(20,30,24,.28), inset 0 0 0 1px rgba(255,255,255,.5);
    overflow:hidden;flex:0 0 auto;
  }
  .phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:22px;background:#1d241f;border-radius:0 0 14px 14px;z-index:40}
  .app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--cream)}
  .app-head{padding:20px 18px 10px;flex:0 0 auto}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .head-title{font-size:12px;color:var(--muted);letter-spacing:.08em}
  .head-user{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--green);font-weight:600}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--green-3);color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:700}
  .app-main{flex:1;overflow-y:auto;padding:4px 18px 96px;scroll-behavior:smooth}
  .app-main::-webkit-scrollbar{width:0}
  .bottom-nav{position:absolute;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:6px;z-index:30}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#849087}
  .bottom-nav button i{font-style:normal;font-size:16px;line-height:1}
  .bottom-nav button.on{color:var(--green);font-weight:700}
  .demo-strip{margin:8px 0 0;background:#f1e7cd;color:#7d5a1d;font-size:10.5px;padding:5px 10px;border-radius:7px;display:flex;justify-content:space-between;gap:8px}

  .page{animation:fade .22s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:10px;letter-spacing:.14em;color:var(--green-2);font-weight:700;margin:14px 0 5px}
  .h1{font-size:25px;line-height:1.28;margin:0 0 4px;letter-spacing:-.015em}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.65;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:11px}
  .card.tight{padding:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px}
  .metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 9px;min-width:0}
  .metric b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--green);line-height:1.1}
  .metric span{font-size:10px;color:var(--muted);display:block;margin-top:5px;line-height:1.35}
  .metric em{font-style:normal;font-size:10px;color:#9aa69d}
  .ring-wrap{display:flex;align-items:center;gap:14px}
  .ring{width:98px;height:98px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;position:relative}
  .ring::after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}
  .ring .in{position:relative;z-index:1;text-align:center}
  .ring .in b{display:block;font-family:Georgia,serif;font-size:21px;color:var(--green);line-height:1}
  .ring .in span{font-size:9px;color:var(--muted)}
  .macro{display:grid;gap:7px;flex:1}
  .macro .m{display:grid;grid-template-columns:38px 1fr 48px;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
  .track{height:5px;border-radius:9px;background:#ecefe8;overflow:hidden}
  .track i{display:block;height:100%;border-radius:9px;background:var(--green-2)}
  .macro .m b{font-size:10px;color:#3f4c43;text-align:right;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 7px;border-radius:999px;background:#f0f3ec;color:#5e6b61;white-space:nowrap}
  .chip.planned{background:#f3ead6;color:#8a6420}
  .chip.completed{background:#e4efe5;color:#2c6a47}
  .chip.cancelled{background:#f2e6e2;color:#96503f}
  .chip.ghost{background:transparent;border:1px solid var(--line)}
  .plan{border-left:3px solid var(--green-2)}
  .plan h3{margin:0;font-size:15px}
  .plan .meta{font-size:10.5px;color:var(--muted);margin:3px 0 0}
  .ex{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px dashed #e7ebe2;font-size:12px}
  .ex:first-of-type{border-top:0}
  .ex b{font-weight:600}
  .ex span{color:var(--muted);font-size:11px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--green);color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:600;transition:.18s}
  .btn:active{transform:scale(.98)}
  .btn.block{width:100%}
  .btn.ghost{background:#fff;color:var(--green);border:1px solid #cfdccd}
  .btn.soft{background:var(--green-3);color:var(--green)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #e5cbc3}
  .btn.sm{padding:7px 9px;font-size:11px;border-radius:8px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .link{color:var(--green-2);font-size:11.5px;font-weight:600}
  .muted{color:var(--muted)}
  .tiny{font-size:10.5px;color:#8a958c;line-height:1.6}
  .empty{text-align:center;padding:20px 10px;color:var(--muted);font-size:12px}
  .empty .ico{font-size:26px;display:block;margin-bottom:7px;opacity:.55}
  .skeleton{background:linear-gradient(90deg,#ecefe7 25%,#f6f8f2 37%,#ecefe7 63%);background-size:400% 100%;animation:sk 1.2s infinite;border-radius:8px}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* login */
  .login{height:100%;display:flex;flex-direction:column;padding:54px 24px 24px;background:
    radial-gradient(420px 320px at 90% 0%, #dfe9d9 0%, transparent 60%),var(--cream)}
  .login .brand{display:flex;align-items:center;gap:10px;color:var(--green);font-size:11px;letter-spacing:.14em;font-weight:700}
  .login .brand b{width:42px;height:42px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;letter-spacing:0}
  .login h1{font-size:32px;line-height:1.24;margin:28px 0 8px;letter-spacing:-.02em}
  .login h1 span{color:var(--green-2)}
  .login .lede{font-size:13px;color:#526056;line-height:1.8;margin:0 0 26px}
  .mode{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px;transition:.18s}
  .mode:hover{border-color:#b8cbb6;transform:translateY(-1px)}
  .mode b{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
  .mode b i{font-style:normal;color:var(--green-2);font-size:11px}
  .mode span{font-size:11px;color:var(--muted);line-height:1.55;display:block}
  .login .foot{margin-top:auto;font-size:10px;color:#8a958c;line-height:1.7;border-top:1px solid #e0e4d9;padding-top:12px}

  /* sheets */
  .overlay{position:absolute;inset:0;background:rgba(22,32,25,.46);display:flex;align-items:flex-end;z-index:50;animation:fade .18s ease}
  .sheet{width:100%;max-height:86%;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px 20px;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:up .24s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}
  .grab{width:38px;height:4px;border-radius:4px;background:#d8ded2;margin:6px auto 12px}
  .sheet h2{font-size:17px;margin:0 0 3px}
  .sheet .sheet-sub{font-size:11px;color:var(--muted);margin:0 0 12px;line-height:1.6}
  .sheet-foot{display:flex;gap:8px;margin-top:14px}
  .sheet-foot .btn{flex:1}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .input{width:100%;border:1px solid var(--line);background:#fbfcf8;border-radius:9px;padding:10px 11px;font-size:13px;outline:none}
  .input:focus{border-color:#9db79a;background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .set-row{display:grid;grid-template-columns:18px 1fr 66px 62px 22px;gap:7px;align-items:center;padding:7px 0;border-top:1px dashed #e9ede4}
  .set-row:first-child{border-top:0}
  .set-head{display:grid;grid-template-columns:18px 1fr 66px 62px 22px;gap:7px;font-size:9.5px;color:#7f8b81;font-weight:600;letter-spacing:.02em;padding:2px 0 5px}
  .set-head div:nth-child(3),.set-head div:nth-child(4){text-align:center}
  .set-head div:first-child{text-align:center}
  .set-row .n{font-size:10px;color:#9aa69d;text-align:center}
  .set-row .nm{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .set-row input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 6px;font-size:11.5px;text-align:center;background:#fbfcf8}
  .set-row .x{color:#b7c1b7;font-size:14px;text-align:center}
  .food-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;background:#fff;transition:.15s}
  .food-card.on{border-color:#7fa47a;background:#f2f8f0;box-shadow:0 0 0 2px #e3efe0 inset}
  .food-card .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #b9cbb5;flex:0 0 auto}
  .food-card.on .dot{background:var(--green-2);border-color:var(--green-2)}
  .food-card b{font-size:12px;display:block}
  .food-card span{font-size:10px;color:var(--muted)}
  .food-card .kcal{margin-left:auto;font-size:11px;color:var(--green);font-weight:700;white-space:nowrap}
  .preview{background:#f3f7f0;border:1px solid #dce8d7;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
  .preview b{font-family:Georgia,serif;font-size:21px;color:var(--green)}
  .preview span{font-size:10px;color:var(--muted);display:block}
  .meal-tabs{display:flex;gap:7px;margin:8px 0 2px}
  .meal-tabs button{flex:1;font-size:11px;padding:7px 0;border-radius:8px;background:#f4f6ef;color:#6d796f}
  .meal-tabs button.on{background:var(--green);color:#fff;font-weight:700}
  .meal-block{margin-top:10px}
  .meal-block h4{font-size:10px;letter-spacing:.12em;color:var(--green-2);margin:0 0 5px}
  .diet-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed #e9ede4;font-size:12px}
  .diet-row .nm{flex:1;min-width:0}
  .diet-row .nm b{display:block;font-size:12px;font-weight:600}
  .diet-row .nm span{font-size:10px;color:var(--muted)}
  .diet-row .kcal{font-size:11px;color:var(--green);font-weight:700;width:56px;text-align:right}
  .diet-row .step{display:flex;align-items:center;gap:5px}
  .diet-row .step button{width:20px;height:20px;border-radius:50%;background:#f0f4ec;color:var(--green);font-size:12px;line-height:1}
  .toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);pointer-events:none;background:#1f2a23;color:#fff;font-size:11.5px;padding:9px 14px;border-radius:999px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .2s ease;max-width:86%;text-align:center}
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .legend{display:flex;gap:12px;font-size:10px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}
  .stat-line{display:flex;justify-content:space-between;font-size:11px;padding:6px 0;border-top:1px dashed #e9ede4}
  .stat-line:first-child{border-top:0}
  .stat-line b{color:var(--green)}
  .seg{display:flex;gap:6px;background:#f1f3ec;border-radius:9px;padding:3px}
  .seg button{flex:1;font-size:10.5px;padding:6px 0;border-radius:7px;color:#6d796f}
  .seg button.on{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .back{font-size:11px;color:var(--green);font-weight:600;margin-bottom:10px;display:inline-flex;gap:5px;align-items:center}
  .big-num{font-family:Georgia,serif;font-size:30px;color:var(--green);line-height:1}
  .big-num small{font-family:inherit;font-size:11px;color:var(--muted);font-weight:400}
  .kv{display:flex;justify-content:space-between;font-size:11.5px;padding:7px 0;border-top:1px dashed #e9ede4}
  .kv:first-child{border-top:0}
  .kv span{color:var(--muted)}

  @media(max-width:900px){
    .stage{padding:0;display:block}
    .guide{display:none}
    .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
    .phone::before{display:none}
    .app-head{padding-top:14px}
    .login{padding-top:18px}
  }
  @media(max-width:380px){
    .app-main{padding-left:14px;padding-right:14px}
    .grid3{gap:6px}
    .metric b{font-size:19px}
    .login h1{font-size:28px}
  }
</style>
</head>
<body>
<div class="stage">
  <aside class="guide">
    <div class="logo"><b>循</b>FTDMS / INTERACTIVE PROTOTYPE</div>
    <h1>把一天摊开，<br><span>点着看。</span></h1>
    <p class="lede">这是一个可直接点击的高保真交互原型：不需要后端、不需要安装，数据保存在浏览器本地。右边就是手机界面，按下面的路径走一遍即可。</p>
    <ol class="path">
      <li>进入「今日」，看目标、摄入与今日训练</li>
      <li>点开训练计划，记录每一组并完成计划</li>
      <li>去饮食页加一份鸡胸肉，看汇总变化</li>
      <li>记录今天的体重，同日再存会覆盖</li>
      <li>切到统计页，切换 7 天 / 30 天</li>
      <li>到「我的」改目标，或清空数据看空状态</li>
    </ol>
    <div class="actions">
      <button class="tag" data-act="reset-data">↺ 恢复演示数据</button>
      <button class="tag" data-act="empty-data">◇ 清空看空状态</button>
    </div>
    <p class="hint">提示：底部导航、计划卡片、加号、加减克重、区间切换、目标编辑都可以点。按 Esc 可关闭弹层。</p>
  </aside>

  <div class="phone" id="phone">
    <div class="app" id="app"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const KEY = "ftdms.prototype.v2";
  const $ = (s, r=document) => r.querySelector(s);

  const FOODS = [
    {id:"bread", name:"全麦面包", state:"品牌食品", kcal:246, p:9.0, c:46.0, f:3.5, src:"包装标签"},
    {id:"egg", name:"鸡蛋", state:"生", kcal:143, p:12.6, c:0.7, f:9.5, src:"中国食物成分表"},
    {id:"milk", name:"牛奶", state:"生", kcal:54, p:3.0, c:4.8, f:3.2, src:"中国食物成分表"},
    {id:"rice", name:"米饭", state:"熟", kcal:116, p:2.6, c:25.9, f:0.3, src:"中国食物成分表"},
    {id:"chicken", name:"鸡胸肉", state:"生", kcal:133, p:24.6, c:0.6, f:3.4, src:"中国食物成分表"},
    {id:"broccoli", name:"西兰花", state:"生", kcal:34, p:2.8, c:6.6, f:0.4, src:"中国食物成分表"},
    {id:"banana", name:"香蕉", state:"生", kcal:93, p:1.4, c:22.0, f:0.2, src:"中国食物成分表"},
    {id:"salmon", name:"三文鱼", state:"生", kcal:208, p:20.4, c:0.0, f:13.4, src:"中国食物成分表"},
    {id:"oats", name:"燕麦片", state:"生", kcal:377, p:15.0, c:66.0, f:6.7, src:"包装标签"},
    {id:"sweet", name:"红薯", state:"熟", kcal:86, p:1.6, c:20.1, f:0.1, src:"中国食物成分表"}
  ];
  const FOOD = Object.fromEntries(FOODS.map(f => [f.id, f]));
  const MEALS = [["BREAKFAST","早餐"],["LUNCH","午餐"],["DINNER","晚餐"],["SNACK","加餐"]];

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function addDays(n){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return iso(d); }
  function today(){ return addDays(0); }
  function mmdd(s){ return s.slice(5).replace("-", "/"); }
  function round(n){ return Math.round(n * 10) / 10; }

  function seed(){
    const t = today();
    return {
      user:{ name:"阿哲", username:"demo2026" },
      goal:{ kcal:2400, protein:160, carb:260, fat:65 },
      plans:[
        {id:1, date:t, title:"腿部力量日", status:"planned", note:"注意膝盖对齐脚尖",
         items:[{name:"杠铃深蹲",sets:4,reps:8,weight:80},{name:"罗马尼亚硬拉",sets:3,reps:10,weight:60},{name:"腿举",sets:3,reps:12,weight:120}]},
        {id:2, date:addDays(-1), title:"背部拉力日", status:"completed", note:"",

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !data.plans || !data.goal) return null;
      return data;
    } catch(e){ return null; }
  }

  let state = load() || Object.assign(seed(), {screen:"login", range:7, modal:null, meal:"LUNCH", logged:false});
  state.screen = "login";
  state.modal = null;
  state.range = state.range || 7;

  const app = $("#app");

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}

  function toast(msg){
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("#phone").appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  function go(screen){
    state.screen = screen;
    state.modal = null;
    render();
    const main = $(".app-main"); if (main) main.scrollTop = 0;

  function open(modal){ state.modal = modal; render(); }

  function totals(date){
    const list = state.diets.filter(d => d.date === date);
    const sum = {kcal:0,p:0,c:0,f:0};
    for (const d of list){
      const f = FOOD[d.foodId]; if (!f) continue;
      const k = d.grams / 100;
      sum.kcal += f.kcal * k; sum.p += f.p * k; sum.c += f.c * k; sum.f += f.f * k;
    }
    return {kcal:Math.round(sum.kcal), p:round(sum.p), c:round(sum.c), f:round(sum.f), count:list.length};
  }
  function planOf(date){ return state.plans.find(p => p.date === date); }
  function weightOf(date){
    const rec = state.body.find(b => b.date === date);
    return rec ? rec.weight : null;
  }
  function statusText(s){ return s === "completed" ? "已完成" : s === "cancelled" ? "已取消" : "待完成"; }
  function statusChip(s){ return '<span class="chip ' + s + '">' + statusText(s) + '</span>'; }

  // ---------- charts ----------
  function barChart(items){
    const W = 320, H = 148, L = 28, B = 22, T = 10;
    const max = Math.max(1, ...items.map(i => i.value || 0));
    const n = items.length, step = (W - L - 8) / n, bw = Math.min(18, step * 0.52);
    let bars = "", labels = "", grid = "";
    for (let g = 0; g <= 2; g++){
      const y = T + (H - T - B) * g / 2;
      grid += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - 4) + '" y2="' + y + '" stroke="#eef1e9" stroke-width="1"/>';
      grid += '<text x="2" y="' + (y + 3) + '" font-size="8" fill="#9aa69d">' + Math.round(max * (1 - g / 2)) + '</text>';
    }
    items.forEach((it, i) => {
      const x = L + step * i + (step - bw) / 2;
      if (it.value != null){
        const h = Math.max(2, (H - T - B) * it.value / max);
        bars += '<rect x="' + x + '" y="' + (H - B - h) + '" width="' + bw + '" height="' + h + '" rx="4" fill="#2f7d5c"/>';
      } else {
        bars += '<line x1="' + x + '" y1="' + (H - B - 6) + '" x2="' + (x + bw) + '" y2="' + (H - B - 6) + '" stroke="#d9e0d5" stroke-width="2" stroke-dasharray="3 3"/>';
      }
      if (n <= 10 || i % Math.ceil(n / 7) === 0 || i === n - 1){
        labels += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" font-size="8" fill="#8a958c" text-anchor="middle">' + it.label + '</text>';
      }
    });
    return '<svg class="chart" viewBox="0 0 320 148" role="img" aria-label="每日能量摄入柱状图">' + grid + bars + labels + '</svg>';
  }
  function lineChart(items){
    const W = 320, H = 150, L = 30, R = 8, T = 14, B = 24;
    const vals = items.filter(i => i.value != null).map(i => i.value);
    if (!vals.length) return '<div class="empty"><span class="ico">◌</span>这个区间还没有体重记录</div>';
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 1){ min -= .5; max += .5; }
    const pad = (max - min) * .15; min -= pad; max += pad;
    const n = items.length;
    const x = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1));
    const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
    let pts = [], dots = "", labels = "", grid = "";
    items.forEach((it, i) => {
      if (it.value != null){
        pts.push([x(i), y(it.value)]);
        dots += '<circle cx="' + x(i) + '" cy="' + y(it.value) + '" r="2.6" fill="#fff" stroke="#2f7d5c" stroke-width="1.6"/>';
      }
      if (i % Math.ceil(n / 7) === 0 || i === n - 1){
        labels += '<text x="' + x(i) + '" y="' + (H - 7) + '" font-size="7.5" fill="#8a958c" text-anchor="middle">' + it.label + '</text>';
      }
    });
    for (let g = 0; g <= 2; g++){
      const yy = T + (H - T - B) * g / 2;
      grid += '<line x1="' + L + '" y1="' + yy + '" x2="' + (W - R) + '" y2="' + yy + '" stroke="#eef1e9" stroke-width="1"/>';
      grid += '<text x="2" y="' + (yy + 3) + '" font-size="8" fill="#9aa69d">' + (max - (max - min) * g / 2).toFixed(1) + '</text>';
    }
    const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = path + " L" + pts[pts.length - 1][0].toFixed(1) + " " + (H - B) + " L" + pts[0][0].toFixed(1) + " " + (H - B) + " Z";
    return '<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="体重趋势折线图">' + grid +
      '<path d="' + area + '" fill="#e7efe6" opacity=".8"/>' +
      '<path d="' + path + '" fill="none" stroke="#2f7d5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + labels + '</svg>';
  }

  function renderStats(){
    const range = state.range;
    const days = range === 30 ? 30 : 7;
    const from = addDays(-(days - 1)), t = today();
    const plans = state.plans.filter(p => p.date >= from && p.date <= t);
    const completed = plans.filter(p => p.status === "completed").length;
    const cancelled = plans.filter(p => p.status === "cancelled").length;
    const denom = plans.length - cancelled;
    const rate = denom ? Math.round(completed / denom * 100) : null;
    const energy = [], weights = [];
    const bodyMap = Object.fromEntries(state.body.map(b => [b.date, b.weight]));
    for (let i = 0; i < days; i++){
      const d = addDays(-(days - 1 - i));
      const tot = totals(d);
      energy.push({label:mmdd(d), value:tot.count ? tot.kcal : null});
      if (bodyMap[d] != null) weights.push({label:mmdd(d), value:bodyMap[d]});
    }
    const wAvg = weights.length ? round(weights.reduce((s,x) => s + x.value, 0) / weights.length) : null;
    const first = weights.length ? weights[0].value : null, last = weights.length ? weights[weights.length-1].value : null;
    return '<div class="page"><p class="eyebrow">LOOK BACK, MOVE FORWARD</p><h2 class="h1">看见自己的节奏。</h2>' +
      '<p class="sub">只统计有效记录。缺失日留白，不按 0 拉低均值。</p>' +
      '<div class="seg"><button class="' + (range === 7 ? "on" : "") + '" data-act="range" data-range="7">7 天</button><button class="' + (range === 30 ? "on" : "") + '" data-act="range" data-range="30">30 天</button><button data-act="range" data-range="custom">自定义</button></div>' +
      '<div class="grid3" style="margin-top:10px"><div class="metric"><b>' + (rate == null ? "—" : rate + "%") + '</b><span>计划完成率</span></div><div class="metric"><b>' + state.workouts.filter(w => w.date >= from).length + '</b><span>实际训练</span></div><div class="metric"><b>' + (wAvg == null ? "—" : wAvg) + '</b><span>区间体重均值</span></div></div>' +
      '<div class="card"><div class="row"><b style="font-size:13px">每日能量摄入</b><span class="chip ghost">有效 ' + energy.filter(e => e.value != null).length + ' 天</span></div>' +
      barChart(energy) + '<div class="tiny">未记录日留空，未记录不代表摄入为零。</div></div>' +
      '<div class="card"><div class="row"><b style="font-size:13px">体重趋势</b><span class="chip ghost">' + weights.length + ' 个有效点</span></div>' +
      lineChart(weights) + '<div class="tiny">' + (first != null ? '区间 ' + first + ' → ' + last + ' kg，变化 ' + (last - first).toFixed(1) + ' kg。' : '暂无体重记录。') + '</div></div>' +
      '<div class="card"><div class="stat-line"><span>区间</span><b>' + from + ' 至 ' + t + '</b></div><div class="stat-line"><span>计划 / 完成 / 取消</span><b>' + plans.length + ' / ' + completed + ' / ' + cancelled + '</b></div><div class="stat-line"><span>完成率口径</span><b>完成 ÷（计划 − 取消）</b></div></div></div>';
  }

  function renderProfile(){
    const goal = state.goal;
    return '<div class="page"><p class="eyebrow">YOUR OWN PACE</p><h2 class="h1">为自己，<br>设定一个方向。</h2>' +
      '<p class="sub">' + state.user.username + ' · 数据只保存在当前浏览器。</p>' +
      '<div class="card"><div class="row"><div><div class="tiny">个人资料</div><b style="font-size:15px">' + state.user.name + '</b><div class="tiny">男 · 1997-08-16 · 178 cm</div></div><span class="avatar" style="width:38px;height:38px;font-size:14px">' + state.user.name.slice(0,1) + '</span></div></div>' +
      '<div class="card"><div class="row"><div><div class="tiny">每日营养目标</div><div class="big-num" style="font-size:25px">' + goal.kcal + ' <small>kcal</small></div></div><button class="btn ghost sm" data-act="goal">修改目标</button></div>' +
      '<div class="kv"><span>蛋白质</span><b>' + goal.protein + ' g</b></div><div class="kv"><span>碳水</span><b>' + goal.carb + ' g</b></div><div class="kv"><span>脂肪</span><b>' + goal.fat + ' g</b></div></div>' +
      '<div class="card"><div class="row"><div><div class="tiny">本机数据</div><b style="font-size:13px">' + state.plans.length + ' 个计划 · ' + state.diets.length + ' 条饮食 · ' + state.body.length + ' 次体重</b></div></div>' +
      '<div class="btn-row" style="margin-top:10px"><button class="btn ghost sm" data-act="reset-data">恢复演示数据</button><button class="btn ghost sm" data-act="empty-data">清空数据</button></div></div>' +
      '<button class="btn ghost block" data-act="logout">退出登录</button>' +
      '<p class="tiny" style="margin-top:12px;text-align:center">循练仅用于个人记录，营养数据为估算，不构成医疗建议。</p></div>';
  }

  function renderModal(){
    const m = state.modal; if (!m) return "";
    let body = "";
    if (m.type === "plan"){
      const p = state.plans.find(x => x.id === m.id);
      if (!p) return "";
      body = '<div class="sheet"><div class="grab"></div><div class="row"><h2>' + p.title + '</h2>' + statusChip(p.status) + '</div>' +
        '<p class="sheet-sub">' + p.date + ' · 训练目标（不是实际记录）' + (p.note ? ' · ' + p.note : '') + '</p>' +
        '<div class="card tight">' + p.items.map(it => '<div class="ex"><b>' + it.name + '</b><span>' + it.sets + ' 组 × ' + it.reps + ' 次' + (it.weight ? ' · ' + it.weight + ' kg' : ' · 自重') + '</span></div>').join("") + '</div>' +
        (p.status === "planned" ? '<div class="sheet-foot"><button class="btn" data-act="start-record" data-id="' + p.id + '">记录并完成</button><button class="btn ghost" data-act="complete" data-id="' + p.id + '">仅标记完成</button></div>' +
          '<button class="btn danger block" style="margin-top:8px" data-act="ask-cancel" data-id="' + p.id + '">取消这个计划</button>' :
          '<div class="tiny" style="text-align:center;margin-top:8px">' + (p.status === "completed" ? '计划已完成；实际记录在训练历史里。' : '计划已取消，不进入完成率分母。') + '</div>') +
        '<button class="btn ghost block" style="margin-top:8px" data-act="close">关闭</button></div>';
    }
    if (m.type === "record"){
      const p = state.plans.find(x => x.id === m.id);
      if (!p) return "";
      const rows = p.items.flatMap(it => Array.from({length:it.sets}, (_,i) => ({name:it.name, n:i+1, weight:it.weight, reps:it.reps})));
      body = '<div class="sheet"><div class="grab"></div><h2>记录实际训练</h2><p class="sheet-sub">' + p.title + ' · 只填真正完成的组；保存后计划标记完成。</p>' +
        '<div class="set-head"><div>组</div><div>动作</div><div>重量 kg</div><div>次数</div><div></div></div><div id="set-list">' + rows.map((r,i) => '<div class="set-row" data-row="' + i + '"><div class="n">' + r.n + '</div><div class="nm">' + r.name + '</div>' +
          '<input type="number" step="0.5" min="0" max="500" value="' + r.weight + '" aria-label="重量"><input type="number" min="1" max="100" value="' + r.reps + '" aria-label="次数">' +
          '<button class="x" data-act="del-set">×</button></div>').join("") + '</div>' +
        '<button class="btn ghost block" style="margin-top:8px" data-act="add-set">＋ 加一组</button>' +
        '<div class="sheet-foot"><button class="btn" data-act="save-workout" data-id="' + p.id + '">保存并完成计划</button><button class="btn ghost" data-act="close">取消</button></div></div>';
    }
    if (m.type === "food"){
      const meal = m.meal || "LUNCH";
      body = '<div class="sheet"><div class="grab"></div><h2>添加一份食物</h2><p class="sheet-sub">选择食物与克重；营养由食物库换算，保存后写入当日汇总。</p>' +
        '<div class="meal-tabs">' + MEALS.map(([c,n]) => '<button class="' + (c === meal ? "on" : "") + '" data-act="meal" data-meal="' + c + '">' + n + '</button>').join("") + '</div>' +
        '<div id="food-list" style="max-height:230px;overflow:auto;margin-top:10px">' + FOODS.map(f => '<button class="food-card ' + (f.id === (m.foodId || "chicken") ? "on" : "") + '" data-act="pick-food" data-food="' + f.id + '">' +
          '<span class="dot"></span><div><b>' + f.name + ' · ' + f.state + '</b><span>' + f.src + ' · 蛋白 ' + f.p + ' g / 100 g</span></div><span class="kcal">' + f.kcal + ' kcal</span></button>').join("") + '</div>' +
        '<div class="field" style="margin-top:8px"><label>实际摄入（g）</label><input class="input" id="food-grams" type="number" min="1" max="2000" value="100"></div>' +
        '<div class="preview" id="food-preview"><div><span>预计摄入</span><b id="preview-kcal">133</b></div><div class="tiny" id="preview-macro" style="text-align:right">蛋白 24.6 g<br>碳水 0.6 g</div></div>' +
        '<div class="sheet-foot"><button class="btn" data-act="save-diet">添加到' + (MEALS.find(x => x[0] === meal) || ["","午餐"])[1] + '</button><button class="btn ghost" data-act="close">取消</button></div></div>';
    }
    if (m.type === "goal"){
      body = '<div class="sheet"><div class="grab"></div><h2>修改每日目标</h2><p class="sheet-sub">保存后立即生效，历史记录不变。</p>' +
        '<div class="field"><label>能量（kcal，500–6000）</label><input class="input" id="goal-kcal" type="number" value="' + state.goal.kcal + '"></div>' +
        '<div class="two"><div class="field"><label>蛋白质（g）</label><input class="input" id="goal-p" type="number" value="' + state.goal.protein + '"></div>' +
        '<div class="field"><label>碳水（g）</label><input class="input" id="goal-c" type="number" value="' + state.goal.carb + '"></div></div>' +
        '<div class="field"><label>脂肪（g）</label><input class="input" id="goal-f" type="number" value="' + state.goal.fat + '"></div>' +
        '<div class="sheet-foot"><button class="btn" data-act="save-goal">保存目标</button><button class="btn ghost" data-act="close">取消</button></div></div>';
    }
    if (m.type === "confirm"){
      const p = state.plans.find(x => x.id === m.id);
      body = '<div class="sheet"><div class="grab"></div><h2>取消这个计划？</h2><p class="sheet-sub">' + (p ? p.title : "") + ' 取消后不进入完成率分母，也不会删除已有训练记录。</p>' +
        '<div class="sheet-foot"><button class="btn danger" data-act="cancel-plan" data-id="' + m.id + '">确认取消</button><button class="btn ghost" data-act="close">再想想</button></div></div>';
    }
    return '<div class="overlay" data-act="backdrop"><div class="sheet">' + body.replace(/^<div class="sheet">|<\/div>$/g, "") + '</div></div>';
  }

  function render(){
    if (!state.logged || state.screen === "login"){
      app.innerHTML = renderLogin();
      return;
    }
    const screens = {today:renderToday, training:renderTraining, diet:renderDiet, body:renderBody, stats:renderStats, profile:renderProfile};
    const content = (screens[state.screen] || renderToday)();
    app.innerHTML = renderHead() + '<main class="app-main">' + content + '</main>' + renderNav() + renderModal();
    bindModal();
  }

  function bindModal(){
    if (!state.modal || state.modal.type !== "food") return;
    const input = $("#food-grams"); if (!input) return;
    const f = FOOD[state.modal.foodId || "chicken"];
    const update = () => {
      const g = Math.max(1, Math.min(2000, Number(input.value) || 0));
      $("#preview-kcal").textContent = Math.round(f.kcal * g / 100);
      $("#preview-macro").textContent = "蛋白 " + (f.p * g / 100).toFixed(1) + " g · 碳水 " + (f.c * g / 100).toFixed(1) + " g";
    };
    input.addEventListener("input", update);
    update();
    const on = document.querySelector(".food-card.on");
    const list = $("#food-list");
    if (on && list) list.scrollTop = Math.max(0, on.offsetTop - list.offsetTop - 36);
  }

  // ---------- events ----------
  document.addEventListener("click", function(e){
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    if (act === "backdrop"){
      if (e.target === el) close();
      return;
    }
    if (act === "login"){
      const mode = el.dataset.mode;
      if (mode === "empty"){
        state.plans = []; state.workouts = []; state.diets = []; state.body = [];
      }
      state.logged = true; state.screen = "today"; state.modal = null;
      save(); render(); toast(mode === "empty" ? "已进入空账户，先设置目标或记录第一餐" : "演示数据已就绪");
    }
    else if (act === "nav"){ go(el.dataset.screen); }
    else if (act === "open-plan"){ open({type:"plan", id:Number(el.dataset.id)}); }
    else if (act === "close"){ close(); }
    else if (act === "start-record"){ open({type:"record", id:Number(el.dataset.id)}); }
    else if (act === "add-set"){
      const list = $("#set-list"); if (!list) return;
      const last = list.querySelector(".set-row:last-child");
      if (!last) return;
      const name = last.querySelector(".nm").textContent;
      const n = list.querySelectorAll(".set-row").length + 1;
      const row = document.createElement("div");
      row.className = "set-row";
      row.innerHTML = '<div class="n">' + n + '</div><div class="nm">' + name + '</div>' +
        '<input type="number" step="0.5" min="0" max="500" value="' + last.querySelector('input').value + '" aria-label="重量">' +
        '<input type="number" min="1" max="100" value="' + last.querySelectorAll('input')[1].value + '" aria-label="次数">' +
        '<button class="x" data-act="del-set">×</button>';
      list.appendChild(row);
    }
    else if (act === "del-set"){
      const row = el.closest(".set-row");
      if (row && row.parentNode.children.length > 1) row.remove();
      else toast("至少保留一组；如果没练，可以关闭后选择「仅标记完成」");
    }
    else if (act === "save-workout"){
      const id = Number(el.dataset.id);
      const p = state.plans.find(x => x.id === id);
      const rows = Array.from(document.querySelectorAll("#set-list .set-row"));
      if (!rows.length){ toast("至少记录一组"); return; }
      const sets = rows.map(r => ({name:r.querySelector(".nm").textContent, weight:Number(r.querySelectorAll("input")[0].value) || 0, reps:Number(r.querySelectorAll("input")[1].value) || 0}));
      state.workouts.push({id:Date.now(), planId:id, date:p.date, sets});
      p.status = "completed";
      state.modal = null; save(); render();
      toast("训练已记录，计划已完成");
    }
    else if (act === "complete"){
      const p = state.plans.find(x => x.id === Number(el.dataset.id));
      p.status = "completed"; state.modal = null; save(); render(); toast("已标记完成，未创建实际训练记录");
    }
    else if (act === "ask-cancel"){ open({type:"confirm", id:Number(el.dataset.id)}); }
    else if (act === "cancel-plan"){
      const p = state.plans.find(x => x.id === Number(el.dataset.id));
      p.status = "cancelled"; state.modal = null; save(); render(); toast("计划已取消，不计入完成率分母");
    }
    else if (act === "add-food"){ open({type:"food", meal:"LUNCH", foodId:"chicken"}); }
    else if (act === "meal"){ state.modal.meal = el.dataset.meal; render(); }
    else if (act === "pick-food"){ state.modal.foodId = el.dataset.food; render(); }
    else if (act === "save-diet"){
      const m = state.modal;
      const grams = Math.max(1, Math.min(2000, Number($("#food-grams").value) || 0));
      state.diets.push({id:Date.now(), date:today(), meal:m.meal, foodId:m.foodId || "chicken", grams});
      state.modal = null; save(); render(); toast("已添加到" + (MEALS.find(x => x[0] === m.meal) || ["","午餐"])[1] + "，汇总已更新");
    }
    else if (act === "grams"){
      const d = state.diets.find(x => x.id === Number(el.dataset.id));
      d.grams = Math.max(1, Math.min(2000, d.grams + Number(el.dataset.delta)));
      save(); render();
    }
    else if (act === "del-diet"){
      state.diets = state.diets.filter(x => x.id !== Number(el.dataset.id));
      save(); render(); toast("已删除这条饮食记录");
    }
    else if (act === "save-weight"){
      const date = $("#body-date").value || today();
      const weight = Number($("#body-weight").value);
      if (!(weight >= 20 && weight <= 300)){ toast("体重需在 20–300 kg 之间"); return; }
      const rec = state.body.find(b => b.date === date);
      if (rec) rec.weight = weight; else state.body.push({date, weight});
      state.body.sort((a,b) => a.date < b.date ? -1 : 1);
      save(); render(); toast(rec ? "已更新 " + date + " 的体重" : "已记录 " + date + " 的体重");
    }
    else if (act === "range"){
      if (el.dataset.range === "custom"){ toast("原型里自定义区间用 7/30 天演示；真实产品可选任意起止日期"); return; }
      state.range = Number(el.dataset.range); save(); render();
    }
    else if (act === "goal"){ open({type:"goal"}); }
    else if (act === "save-goal"){
      const kcal = Number($("#goal-kcal").value), p = Number($("#goal-p").value), c = Number($("#goal-c").value), f = Number($("#goal-f").value);
      if (!(kcal >= 500 && kcal <= 6000)){ toast("能量需在 500–6000 kcal 之间"); return; }
      state.goal = {kcal, protein:p, carb:c, fat:f};
      state.modal = null; save(); render(); toast("目标已更新");
    }
    else if (act === "reset-data"){
      const fresh = seed(); state.plans = fresh.plans; state.workouts = fresh.workouts; state.diets = fresh.diets; state.body = fresh.body; state.goal = fresh.goal;
      state.logged = true; state.screen = "today"; state.modal = null; save(); render(); toast("演示数据已恢复");
    }
    else if (act === "empty-data"){
      state.plans = []; state.workouts = []; state.diets = []; state.body = [];
      state.logged = true; state.screen = "today"; state.modal = null; save(); render(); toast("已清空，当前是空账户状态");
    }
    else if (act === "logout"){
      state.logged = false; state.screen = "login"; state.modal = null; save(); render();
    }
  });

  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && state.modal) close(); });

  render();
})();
</script>
</body>
</html>
