# =====================================================================
# h2 profile：无 MySQL 环境时的"一键试跑"配置
# ---------------------------------------------------------------------
# 启动方式：java -jar ftdms-backend-1.0.0.jar --spring.profiles.active=h2
#          或 mvn spring-boot:run -Dspring-boot.run.profiles=h2
# 特点：使用本地文件数据库（backend/data/ftdms.mv.db），无需安装任何数据库；
#       建表与种子数据取自 db/schema-h2.sql、db/data.sql。
# 注意：仅供本地开发/演示与自测，验收与部署必须使用 MySQL 8.4 + 默认 profile。
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/ftdms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data.sql
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# 演示账号：首次启动时若库中没有管理员，则按此配置创建
app:
  bootstrap:
    enabled: true
    admin-username: admin
    admin-password: Admin@12345

logging:
  level:
    com.g13.ftdms: DEBUG
